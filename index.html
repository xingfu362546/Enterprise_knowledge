<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业知识库 · 原型导航</title>
  <meta http-equiv="refresh" content="0; url=prototype/index.html" />
  <link rel="canonical" href="prototype/index.html" />
  <style>
    :root {
      --bg: #f1f5f9;
      --primary: #0e7490;
      --ink: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--primary);
      background: #ecfeff;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.65; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 11px 28px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover { background: #0891b2; }
  </style>
  <script>location.replace('prototype/index.html');</script>
</head>
<body>
  <div class="card">
    <span class="badge">Cloudflare Pages</span>
    <h1>企业知识库 · 智能问答原型</h1>
    <p>小Q 助手 · PC 门户 + 小程序。若未自动跳转，请点击下方按钮。</p>
    <a href="prototype/index.html">进入原型导航</a>
  </div>
</body>
</html>
