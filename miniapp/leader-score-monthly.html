<!DOCTYPE html>

<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>月度评分</title>

  <link rel="stylesheet" href="../assets/6q-theme.css" />

  <link rel="stylesheet" href="../assets/common.css" />

  <link rel="stylesheet" href="../assets/mp-perf.css" />

  <link rel="stylesheet" href="../assets/supervisor-score.css" />
</head>

<body style="background:#e8e8e8">

  <div class="mp-device">

    <div class="mp-screen">

      <div class="mp-capsule" aria-hidden="true"></div>

      <div class="mp-subnav">

        <button class="back" type="button" onclick="tryLeave()">‹</button>

        <div class="title">评分</div>

      </div>

      <div class="mp-body" style="padding-bottom:80px;background:#f5f5f5">

        <div class="mp-banner mp-banner-blue" style="margin-top:12px">

          <span class="mp-banner-icon">📝</span>

          <span>展开指标可查看员工填写的长文本；下月目标仅查看，无需确认。</span>

        </div>

        <div id="mp-score-list"></div>

        <div class="mp-score-bar" id="mp-score-bar">工作块合计 —/100</div>

        <div id="mp-employee-readonly" class="mp-readonly-stack"></div>

        <div id="mp-next-month-readonly" class="mp-readonly-stack mp-readonly-stack--next"></div>

      </div>

      <div class="mp-score-footer">

        <button type="button" style="flex:1;padding:12px;border:1px solid #d9d9d9;border-radius:8px;background:#fff" onclick="tryLeave()">返回</button>

        <button type="button" id="mp-btn-submit" style="flex:1;padding:12px;border:none;border-radius:8px;background:var(--mp-green-3);color:#fff;font-weight:600">提交评分</button>

      </div>

    </div>

  </div>

  <script src="../assets/perf-score-format.js"></script>
  <script src="../assets/supervisor-score.js"></script>

  <script>

    var mpDirty = false;

    SupervisorScore.initMpMonthlyScorePage();

    document.querySelectorAll('.mp-score-input').forEach(function (i) {

      i.addEventListener('input', function () { mpDirty = true; });

    });

    function tryLeave() {

      if (mpDirty && !confirm('有未保存改动，确定离开？')) return;

      location.href = 'task-list.html?tab=leader';

    }

  </script>
</body>

</html>
