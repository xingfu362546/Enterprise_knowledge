<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6Q教育 · 员工首页</title>
  <link rel="stylesheet" href="../assets/6q-theme.css" />
  <link rel="stylesheet" href="../assets/common.css" />
  <link rel="stylesheet" href="../assets/mp-kb.css" />
</head>
<body style="background:#e8e8e8">
  <div class="mp-device">
    <div class="mp-screen">
      <div class="mp-capsule" aria-hidden="true"></div>
      <div class="mp-header">
        <h1>6Q教育</h1>
        <p>今天又是能量满满的一天!</p>
      </div>
      <div class="mp-body">
        <div class="mp-service-card">
          <h2 class="mp-service-title">自助服务</h2>
          <div class="mp-grid" id="mp-grid"></div>
        </div>
      </div>
      <nav id="mp-tabbar" class="mp-tabbar"></nav>

      <div class="mp-kb-mascot-wrap is-expanded" id="mp-kb-mascot-wrap">
        <div class="mp-kb-mascot-bubble" id="mp-kb-mascot-bubble">
          有制度问题？点我问～
        </div>
        <button type="button" class="mp-kb-mascot-btn" id="mp-kb-mascot-btn" aria-label="打开企业知识库助手小Q">
          <div class="mp-kb-mascot">
            <div class="mp-kb-mascot-head">
              <span class="mp-kb-mascot-ear mp-kb-mascot-ear--l"></span>
              <span class="mp-kb-mascot-ear mp-kb-mascot-ear--r"></span>
              <div class="mp-kb-mascot-face">
                <span class="mp-kb-mascot-eye mp-kb-mascot-eye--l"></span>
                <span class="mp-kb-mascot-eye mp-kb-mascot-eye--r"></span>
                <span class="mp-kb-mascot-blush mp-kb-mascot-blush--l"></span>
                <span class="mp-kb-mascot-blush mp-kb-mascot-blush--r"></span>
                <span class="mp-kb-mascot-mouth"></span>
              </div>
            </div>
            <div class="mp-kb-mascot-body">
              <span class="mp-kb-mascot-book"></span>
            </div>
            <span class="mp-kb-mascot-tag">小Q</span>
          </div>
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/frame.js"></script>
  <script>initMpHome();</script>
  <script src="../assets/mp-kb-mascot.js"></script>
</body>
</html>
